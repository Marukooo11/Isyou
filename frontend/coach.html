<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2efe6">
  <meta name="description" content="Isyou 成长手帐与侧边栏 Coach。">
  <title>Isyou · 我的成长手帐</title>
  <link rel="stylesheet" href="./coach.css">
</head>
<body>
  <header class="topbar">
    <button class="ink-button" id="back-button" type="button">← 岗位方向</button>
    <a class="brand" href="./index.html" aria-label="返回 Isyou 首页">Isyou</a>
    <div class="topbar__actions">
      <span class="connection" id="connection-label" aria-live="polite">连接中</span>
      <button class="ink-button" id="quiet-button" type="button" aria-pressed="false">安静模式</button>
      <button class="ink-button" id="reset-button" type="button">重新开始</button>
      <button class="coach-toggle" id="coach-toggle" type="button" aria-expanded="true" aria-controls="coach-drawer">收起 Coach</button>
    </div>
  </header>
  <div class="book-shell" id="book-shell">
    <main class="notebook" id="notebook">
      <div class="paper-edge" aria-hidden="true"></div>
      <header class="notebook__header">
        <div>
          <p class="eyebrow">MY GROWTH NOTEBOOK</p>
          <h1 id="target-title">正在整理你的成长手帐</h1>
          <p class="notebook__subtitle" id="notebook-subtitle">先确认目标和起点，再决定今天学什么。</p>
        </div>
        <div class="page-count"><strong id="page-count">1</strong><span>页记录</span></div>
      </header>
      <nav class="page-nav" aria-label="手帐章节">
        <a class="is-active" href="#today-section">今天</a>
        <a href="#knowledge-section">已有知识</a>
        <a href="#outputs-section">已有产出</a>
      </nav>
      <p class="margin-note" id="page-note" aria-live="polite">Coach 正在把你的目标整理成第一页。</p>
      <section class="notebook-section today-section" id="today-section">
        <div class="section-heading"><div><span class="section-index">01</span><h2>今天这页</h2></div><span class="day-label" id="day-label">DAY 1</span></div>
        <div id="today-content" class="section-content skeleton-stack" aria-live="polite" aria-busy="true"><div class="skeleton"></div><div class="skeleton is-short"></div></div>
      </section>
      <section class="notebook-section" id="knowledge-section">
        <div class="section-heading"><div><span class="section-index">02</span><h2>已经知道的</h2></div><span class="pencil-label">只写有来源的内容</span></div>
        <div id="knowledge-content" class="section-content"></div>
      </section>
      <section class="notebook-section" id="outputs-section">
        <div class="section-heading"><div><span class="section-index">03</span><h2>留下的产出</h2></div><span class="pencil-label">每条都可回看</span></div>
        <div id="outputs-content" class="section-content"></div>
      </section>
    </main>
    <aside class="coach-drawer is-open" id="coach-drawer" aria-label="Coach 侧边栏">
      <header class="drawer-header">
        <div><p class="eyebrow">SIDE COACH</p><h2>Coach</h2></div>
        <div class="drawer-header__actions"><button class="icon-button" id="pause-button" type="button">暂停</button><button class="icon-button close-drawer" id="close-drawer" type="button" aria-label="收起 Coach">×</button></div>
      </header>
      <div class="drawer-status"><span id="phase-label">准备中</span><span id="drawer-day">Day 1</span></div>
      <div class="conversation" id="timeline" aria-live="polite" aria-busy="true"></div>
      <form class="composer" id="composer">
        <label for="message-input">写给 Coach</label>
        <textarea id="message-input" rows="3" placeholder="写下一句具体情况，也可以选择上面的回答"></textarea>
        <div class="composer__footer"><span id="composer-hint">你的回答会成为后续判断的依据。</span><button class="send-button" id="send-button" type="submit">发送</button></div>
      </form>
    </aside>
    <button class="drawer-tab" id="drawer-tab" type="button" aria-controls="coach-drawer" aria-expanded="false"><span>打开</span> Coach</button>
  </div>
  <script src="./coach-client.js"></script>
  <script src="./coach-page.js"></script>
</body>
</html>
